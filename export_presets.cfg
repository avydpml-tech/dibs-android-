[preset.0]

name="Android"
platform="Android"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/DiBS.apk"
script_export_mode=1
script_encryption_key=""

[preset.0.options]
graphics/32_bits_framebuffer=true
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/orientation=0
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
keystore/debug="debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
permissions/custom_permissions=PoolStringArray(  )
permissions/access_checkin_properties=false
permissions/access_coarse_location=false
permissions/access_fine_location=false
permissions/access_location_extra_commands=false
permissions/access_mock_location=false
permissions/access_network_state=false
permissions/access_surface_flinger=false
permissions/access_wifi_state=false
permissions/account_manager=false
permissions/add_voicemail=false
permissions/authenticate_accounts=false
permissions/battery_stats=false
permissions/bind_accessibility_service=false
permissions/bind_appwidget=false
permissions/bind_device_admin=false
permissions/bind_input_method=false
permissions/bind_nfc_service=false
permissions/bind_notification_listener_service=false
permissions/bind_print_service=false
permissions/bind_remoteviews=false
permissions/bind_text_service=false
permissions/bind_vpn_service=false
permissions/bind_wallpaper=false
permissions/bluetooth=false
permissions/bluetooth_admin=false
permissions/bluetooth_privileged=false
permissions/brick=false
permissions/broadcast_package_removed=false
permissions/broadcast_sms=false
permissions/broadcast_sticky=false
name: Build Godot 3.4.4 Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Java 17 (sdkmanager требует 17+) ──
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Android SDK + NDK r21 ──
      - name: Setup Android SDK & NDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest

          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

      # ── Godot 3.4.4 (x11.64 — для Godot 3.x, headless появился в 4.x) ──
      - name: Download Godot 3.4.4
        run: |
          # Пробуем скачать с TuxFamily с User-Agent (без него может блокировать)
          curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64)" \
            -o godot.zip \
            "https://downloads.tuxfamily.org/godotengine/3.4.4/Godot_v3.4.4-stable_x11.64.zip"

          # Проверяем, что файл нормального размера (должен быть ~35MB)
          FILESIZE=$(stat -c%s godot.zip)
          echo "Downloaded size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "ERROR: File too small, download failed"
            exit 1
          fi

          unzip -q godot.zip
          chmod +x Godot_v3.4.4-stable_x11.64
          sudo mv Godot_v3.4.4-stable_x11.64 /usr/local/bin/godot
          godot --version

      # ── Export Templates 3.4.4 ──
      - name: Download & unpack templates
        run: |
          curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64)" \
            -o templates.tpz \
            "https://downloads.tuxfamily.org/godotengine/3.4.4/Godot_v3.4.4-stable_export_templates.tpz"

          FILESIZE=$(stat -c%s templates.tpz)
          echo "Templates size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "ERROR: Templates download failed"
            exit 1
          fi

          mkdir -p ~/.local/share/godot/templates/3.4.4.stable
          unzip -q templates.tpz -d ~/.local/share/godot/templates/3.4.4.stable/

      # ── Debug Keystore ──
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── Godot Editor Settings ──
      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-3.tres << 'EOF'
          [gd_resource type="EditorSettings" format=2]
          [resource]
          export/android/android_sdk_path = "/home/runner/android-sdk"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      # ── Сборка APK ──
      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --path . --no-window --export "Android" build/android/DiBS.apk

      # ── Загрузка артефакта ──
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiBS-Android-APK
          path: build/android/DiBS.apk

