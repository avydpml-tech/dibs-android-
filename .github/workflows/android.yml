      - name: Export APK
        run: |
          # Проверяем, есть ли export_presets.cfg
          if [ ! -f "$GITHUB_WORKSPACE/export_presets.cfg" ]; then
            echo "WARNING: export_presets.cfg not found, creating minimal one"
            cat > "$GITHUB_WORKSPACE/export_presets.cfg" << 'EOF'
[preset.0]

name="Android"
platform="Android"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="game.apk"
script_export_mode=1
script_encryption_key=""

[preset.0.options]

graphics/32_bits_framebuffer=true
xr_features/xr_mode=0
screen/immersive_mode=true
screen/orientation=0
command_line/extra_args=""
apk_expansion/enable=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
EOF
          fi

          # Экспортируем с --quit
          xvfb-run --auto-servernum ./godot --path $GITHUB_WORKSPACE --no-window --export "Android" game.apk --quit 2>&1 | tee godot_export.log || true

          # Ищем APK в нескольких местах
          ls -la $GITHUB_WORKSPACE/*.apk 2>/dev/null || true
          ls -la $GITHUB_WORKSPACE/build/*.apk 2>/dev/null || true

          if [ ! -f "$GITHUB_WORKSPACE/game.apk" ]; then
            echo "ERROR: game.apk not found after export"
            cat godot_export.log | tail -50
            exit 1
          fi
          echo "APK created successfully: $(ls -lh $GITHUB_WORKSPACE/game.apk)"
