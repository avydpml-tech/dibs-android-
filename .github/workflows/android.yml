name: Build Godot 3.4.4 Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.4.4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Java 17 ──
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Android SDK + NDK r21 ──
      - name: Setup Android SDK & NDK
        run: |
          apt-get update -qq && apt-get install -y -qq curl unzip xvfb
          mkdir -p /root/android-sdk/cmdline-tools
          cd /root/android-sdk/cmdline-tools
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest

          echo "ANDROID_SDK_ROOT=/root/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/root/android-sdk" >> $GITHUB_ENV
          export PATH="/root/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

      # ── Debug Keystore ──
      - name: Create debug keystore
        run: |
          mkdir -p /root/.android
          keytool -genkey -v \
            -keystore /root/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── Godot Editor Settings ──
      - name: Configure Godot editor settings
        run: |
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-3.tres << 'EOF'
          [gd_resource type="EditorSettings" format=2]
          [resource]
          export/android/android_sdk_path = "/root/android-sdk"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      # ── Реимпорт ассетов (Godot 3.x иногда падает с кодом 1 при выходе из редактора в CI — игнорируем) ──
      - name: Reimport assets
        run: |
          xvfb-run --auto-servernum godot --path . --editor --quit --no-window || true

      # ── Экспорт APK ──
      - name: Export Android APK
        run: |
          mkdir -p build/android
          xvfb-run --auto-servernum godot --path . --no-window --export "Android" build/android/DiBS.apk

      # ── Загрузка артефакта ──
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiBS-Android-APK
          path: build/android/DiBS.apk
