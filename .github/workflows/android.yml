name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 7583922
        packages: 'platform-tools platforms;android-30 build-tools;30.0.3'

    - name: Download Godot 3.4.4
      run: |
        wget -q https://downloads.tuxfamily.org/godotengine/3.4.4/Godot_v3.4.4-stable_linux_headless.64.zip
        unzip -q Godot_v3.4.4-stable_linux_headless.64.zip
        chmod +x Godot_v3.4.4-stable_linux_headless.64
        sudo mv Godot_v3.4.4-stable_linux_headless.64 /usr/local/bin/godot

    - name: Download and install export templates
      run: |
        wget -q https://downloads.tuxfamily.org/godotengine/3.4.4/Godot_v3.4.4-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/templates/3.4.4.stable
        unzip -q Godot_v3.4.4-stable_export_templates.tpz -d ~/.local/share/godot/templates/3.4.4.stable/
        # Backup path for older Godot versions
        mkdir -p ~/.config/godot/templates/3.4.4.stable
        cp -r ~/.local/share/godot/templates/3.4.4.stable/* ~/.config/godot/templates/3.4.4.stable/ 2>/dev/null || true

    - name: Create debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

    - name: Configure export presets
      run: |
        sed -i 's|keystore/debug="debug.keystore"|keystore/debug="'$PWD'/debug.keystore"|g' export_presets.cfg

    - name: Export Android APK
      run: |
        mkdir -p build
        godot --path . --export-debug "Android" ./build/DiBS.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: DiBS-Android-APK
        path: build/DiBS.apk

    - name: Upload APK to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/DiBS.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITH
UB_TOKEN }}
