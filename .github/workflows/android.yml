name: Build Godot 3.4.4 Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Java 17 (sdkmanager требует 17+) ──
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Android SDK + NDK r21 ──
      - name: Setup Android SDK & NDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest

          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

      # ── Godot 3.4.4 (x11.64 — для Godot 3.x, headless появился в 4.x) ──
      - name: Download Godot 3.4.4
        run: |
          # Пробуем скачать с TuxFamily с User-Agent (без него может блокировать)
          curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64)" \
            -o godot.zip \
            "https://downloads.tuxfamily.org/godotengine/3.4.4/Godot_v3.4.4-stable_x11.64.zip"

          # Проверяем, что файл нормального размера (должен быть ~35MB)
          FILESIZE=$(stat -c%s godot.zip)
          echo "Downloaded size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "ERROR: File too small, download failed"
            exit 1
          fi

          unzip -q godot.zip
          chmod +x Godot_v3.4.4-stable_x11.64
          sudo mv Godot_v3.4.4-stable_x11.64 /usr/local/bin/godot
          godot --version

      # ── Export Templates 3.4.4 ──
      - name: Download & unpack templates
        run: |
          curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64)" \
            -o templates.tpz \
            "https://downloads.tuxfamily.org/godotengine/3.4.4/Godot_v3.4.4-stable_export_templates.tpz"

          FILESIZE=$(stat -c%s templates.tpz)
          echo "Templates size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "ERROR: Templates download failed"
            exit 1
          fi

          mkdir -p ~/.local/share/godot/templates/3.4.4.stable
          unzip -q templates.tpz -d ~/.local/share/godot/templates/3.4.4.stable/

      # ── Debug Keystore ──
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── Godot Editor Settings ──
      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-3.tres << 'EOF'
          [gd_resource type="EditorSettings" format=2]
          [resource]
          export/android/android_sdk_path = "/home/runner/android-sdk"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      # ── Сборка APK ──
      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --path . --no-window --export "Android" build/android/DiBS.apk

      # ── Загрузка артефакта ──
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiBS-Android-APK
          path: build/android/DiBS.apk
