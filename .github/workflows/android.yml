      - namname: Build Godot 3.4.4 Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: 3.4.4
  EXPORT_NAME: DiBS

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          apt-get update -qq && apt-get install -y -qq curl unzip
          mkdir -p /root/android-sdk/cmdline-tools
          cd /root/android-sdk/cmdline-tools
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export PATH="/root/android-sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-3.tres << 'EOF'
          [gd_resource type="EditorSettings" format=2]
          [resource]
          export/android/android_sdk_path = "/root/android-sdk"
          export/android/debug_keystore = "/__w/dibs-android-/dibs-android-/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Assets
        continue-on-error: true
        run: |
          xvfb-run --auto-servernum godot --path . --editor --quit --no-window

      - name: Android Debug Build
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build)"
          xvfb-run --auto-servernum godot --path . --no-window --verbose --export-debug "Android" "$EXPORT_DIR/android/$EXPORT_NAME-debug.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiBS-Android-APK
          path: build/android

