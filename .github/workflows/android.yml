name: Build Godot 3.4.4 Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Java 11 (нужен для Android SDK) ──
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # ── Android SDK + NDK r21 (стабильный для Godot 3.4.4) ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK & Build Tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

      # ── Godot 3.4.4 Editor ──
      - name: Download Godot 3.4.4
        run: |
          wget -q https://downloads.tuxfamily.org/godotengine/3.4.4/Godot_v3.4.4-stable_x11.64.zip
          unzip -q Godot_v3.4.4-stable_x11.64.zip
          chmod +x Godot_v3.4.4-stable_x11.64
          sudo mv Godot_v3.4.4-stable_x11.64 /usr/local/bin/godot

      # ── Export Templates 3.4.4 ──
      - name: Download & unpack templates
        run: |
          wget -q https://downloads.tuxfamily.org/godotengine/3.4.4/Godot_v3.4.4-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/templates/3.4.4.stable
          unzip -q Godot_v3.4.4-stable_export_templates.tpz -d ~/.local/share/godot/templates/3.4.4.stable/

      # ── Debug Keystore (обязателен для сборки) ──
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── Editor Settings (пути к SDK и keystore) ──
      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-3.tres << 'EOF'
          [gd_resource type="EditorSettings" format=2]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      # ── Сборка APK ──
      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --path . --no-window --export "Android" build/android/DiBS.apk
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # ── Загрузка артефакта ──
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiBS-Android-APK
          path: build/android/DiBS.apk
